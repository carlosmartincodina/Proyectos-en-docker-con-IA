<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Pro con Archivos - Docker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; width: 450px; height: 650px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }
        .padding { padding: 25px; }
        h2 { text-align: center; color: #0084ff; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
        button { background: #0084ff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0066cc; }
        .toggle-auth { text-align: center; color: #555; font-size: 0.9rem; margin-top: 10px; cursor: pointer; }
        .header { background: #0084ff; color: white; padding: 15px; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ddd; object-fit: cover; border: 2px solid white; }
        .header-info { flex: 1; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; display: flex; flex-direction: column; }
        .msg .sender { font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; color: #555; }
        .msg.sent { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.sent .sender { color: #e0e0e0; }
        .msg.received { background: #e4e6eb; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { padding: 15px; border-top: 1px solid #e5e5e5; display: flex; gap: 8px; align-items: center; }
        .input-area input[type="text"] { margin: 0; flex: 1; border-radius: 20px; background: #f0f2f5; border: none; padding: 10px 15px; }
        .input-area button { margin: 0; width: 40px; height: 40px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; }
        .file-link { color: inherit; font-weight: bold; text-decoration: underline; word-break: break-all; margin-top: 5px; display: block; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla de Login / Registro -->
        <div id="auth-screen" class="padding">
            <h2 id="auth-title">Iniciar Sesión</h2>
            <input type="text" id="username" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">
            <div id="register-fields" class="hidden">
                <label style="font-size: 0.85rem; color: #555;">Foto de Perfil (Opcional):</label>
                <input type="file" id="avatar-input" accept="image/*">
            </div>
            <button id="auth-btn">Entrar</button>
            <p class="toggle-auth" id="toggle-auth">¿No tienes cuenta? Regístrate aquí</p>
        </div>

        <!-- Pantalla de Chat -->
        <div id="chat-screen" class="hidden">
            <div class="header">
                <img id="my-avatar" class="avatar" src="" alt="Avatar">
                <div class="header-info">
                    <b id="my-username">Usuario</b>
                    <div style="font-size: 0.8rem; opacity: 0.9;">En línea</div>
                </div>
                <button onclick="window.location.reload()" style="width: auto; background: none; padding: 5px; font-size: 0.8rem; margin: 0; border: none;">Salir</button>
            </div>
            
            <div class="messages" id="messages-box"></div>
            
            <div class="input-area">
                <!-- Botón de Adjuntar Archivo -->
                <button id="attach-btn" style="background: #6c757d;" title="Adjuntar archivo">📎</button>
                <input type="file" id="file-input" class="hidden">
                
                <input type="text" id="msg-input" placeholder="Escribe un mensaje...">
                <button id="send-btn">🕊️</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let isRegister = false;
        let tokenUsername = "";

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const authTitle = document.getElementById('auth-title');
        const registerFields = document.getElementById('register-fields');
        const authBtn = document.getElementById('auth-btn');
        const toggleAuth = document.getElementById('toggle-auth');
        const messagesBox = document.getElementById('messages-box');
        const msgInput = document.getElementById('msg-input');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');

        toggleAuth.addEventListener('click', () => {
            isRegister = !isRegister;
            authTitle.innerText = isRegister ? "Crear Cuenta" : "Iniciar Sesión";
            authBtn.innerText = isRegister ? "Registrarse" : "Entrar";
            registerFields.classList.toggle('hidden', !isRegister);
            toggleAuth.innerText = isRegister ? "¿Ya tienes cuenta? Conéctate" : "¿No tienes cuenta? Regístrate aquí";
        });

        authBtn.addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if(!username || !password) return alert("Rellena todos los campos");

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            if(isRegister) {
                const file = document.getElementById('avatar-input').files[0];
                if(file) formData.append('avatar', file);
            }

            const url = isRegister ? '/api/register' : '/api/login';
            const res = await fetch(url, { method: 'POST', body: formData });
            const data = await res.json();
            if(!res.ok) return alert(data.error);

            tokenUsername = data.username;
            document.getElementById('my-username').innerText = data.username;
            document.getElementById('my-avatar').src = data.avatarUrl;
            
            authScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            
            loadHistory(data.history);
            socket.emit('userConnected', data.username);
            msgInput.focus();
        });

        function sendMsg() {
            const text = msgInput.value.trim();
            if(!text) return;
            socket.emit('newChatMessage', { sender: tokenUsername, text, type: 'text' });
            msgInput.value = "";
        }
        document.getElementById('send-btn').addEventListener('click', sendMsg);
        msgInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMsg(); });

        // Lógica de adjuntar archivo
        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;

            // Límite de tamaño sugerido para WebSockets (5MB)
            if (file.size > 5 * 1024 * 1024) return alert("El archivo es demasiado grande (Máximo 5MB)");

            const reader = new FileReader();
            reader.onload = function() {
                socket.emit('newChatMessage', {
                    sender: tokenUsername,
                    text: file.name,
                    fileData: reader.result, // Base64 del archivo
                    type: 'file'
                });
                fileInput.value = ""; // Limpiar input
            };
            reader.readAsDataURL(file);
        });

        socket.on('broadcastMessage', (msg) => appendMessage(msg));

        function loadHistory(history) {
            messagesBox.innerHTML = "";
            history.forEach(appendMessage);
        }

        function appendMessage(msg) {
            const div = document.createElement('div');
            div.classList.add('msg', msg.sender === tokenUsername ? 'sent' : 'received');
            
            let content = `<div>${msg.text}</div>`;
            if (msg.type === 'file' && msg.fileData) {
                content = `📁 <a class="file-link" href="${msg.fileData}" download="${msg.text}">${msg.text}</a>`;
            }

            div.innerHTML = `<span class="sender">${msg.sender}</span>${content}`;
            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }
    </script>
</body>
</html>
